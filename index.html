/* Fidelity and interaction repairs */
.post-author-link,.time-link,.reply-context button,.replying-context button,.replying-to button,.replying-as button{border:0;background:transparent;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}

.time-link{color:var(--muted);font-size:14px;white-space:nowrap}
.time-link:hover,.post-author-link:hover strong,.replying-to button:hover,.replying-as button:hover{ text-decoration:underline }
.post-avatar-link{display:block;align-self:flex-start;padding:0;border:0;background:transparent;border-radius:50%;flex:none}
.post-avatar-link:hover{opacity:.88}
.post-context.reply-context{margin:0 0 5px 52px}
.post-context.reply-context button{color:var(--blue);font:inherit}
.detail-page{min-height:calc(100vh - 54px)}

.detail-author{display:flex;align-items:center;gap:10px;min-width:0}

.detail-author-meta .post-author-link{font-size:15px}

.detail-text{font-size:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0 12px}
.detail-post .post-media-grid{margin:10px 0 12px}
.detail-datetime{padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.detail-views{padding:13px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.detail-views strong{color:var(--text);font-size:16px}
.detail-metrics{display:flex;gap:18px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
.detail-metrics button{border:0;background:none;padding:0;color:inherit;cursor:pointer}
.detail-metrics button:hover{text-decoration:underline}
.detail-metrics b{color:var(--text)}
.detail-post .post-actions{max-width:none;margin:4px -8px 0}
.detail-post .action{justify-content:center;flex:1;min-width:0;padding:10px 6px;font-size:13px}
.detail-reply-composer{padding:14px 16px 10px;border-bottom:1px solid var(--border)}

.reply-composer-main textarea::placeholder{color:#7b8b96}
.reply-composer-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:7px}
.composer-tools-small{display:flex;gap:2px}

.replies-heading{padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px}
.replies-empty{padding:28px 16px}

.reply-branch .post{background:#fff}

.conversation-parent .post-text{max-height:110px;overflow:hidden}
.conversation-line{position:absolute;left:36px;top:54px;bottom:0;width:2px;background:#cfd9de;z-index:1}
.replying-context{display:flex;align-items:center;gap:7px;padding:5px 16px 13px 70px;color:var(--muted);font-size:13px}

.replying-context button{color:var(--blue)}

.post-location{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin:7px 0}

 state=saved?{...defaults,...saved,users:seedUsers.map(u=>({...u,...(saved.users||[]).find(x=>x.id===u.id)})),posts:Array.isArray(saved.posts)?saved.posts:seedPosts,following:Array.isArray(saved.following)?saved.following:defaults.following,history:Array.isArray(saved.history)?saved.history:[],readNotifications:Array.isArray(saved.readNotifications)?saved.readNotifications:[],hiddenTrends:Array.isArray(saved.hiddenTrends)?saved.hiddenTrends:[],scheduledPosts:Array.isArray(saved.scheduledPosts)?saved.scheduledPosts:[]}:structuredClone(defaults);
}catch(error){state=structuredClone(defaults)}
const user=id=>state.users.find(u=>u.id===id)||state.users[0];
const me=()=>user('me');
const isFollowing=id=>state.following.includes(id);
const save=()=>{try{localStorage.setItem('orbit-state-v1',JSON.stringify(state))}catch(error){if(error?.name==='QuotaExceededError')toast('保存容量を超えました。画像を減らしてください。')}};
const short=n=>n>=1000000?(n/1000000).toFixed(1).replace(/\.0$/,'')+'M':n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'万':n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'K':String(n||0);
const timeAgo=v=>{const d=Math.max(0,Math.floor((Date.now()-new Date(v).getTime())/60000));return d<1?'たった今':d<60?d+'分':d<1440?Math.floor(d/60)+'時間':Math.floor(d/1440)+'日'};
const fullDate=v=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/(#[\p{L}\p{N}_]+)/gu,'<span class="tag">$1</span>').replace(/(https?:\/\/[^\s]+)/g,'<span class="tag">$1</span>').replace(/(@[a-zA-Z0-9_]+)/g,'<span class="tag">$1</span>');
const avatar=(u,size='')=>`<span class="avatar ${size}" style="background:${esc(u.color)}">${esc(u.initial)}</span>`;
const navItems=[['home','ホーム','home'],['explore','話題を検索','search'],['notifications','通知','bell'],['messages','メッセージ','mail'],['bookmarks','ブックマーク','bookmark'],['lists','リスト','list'],['profile','プロフィール','user'],['settings','設定','settings']];
const trends=[['テクノロジー','AIエージェント','12,482件の投稿'],['日本のトレンド','#個人開発','8,291件の投稿'],['エンタメ','新作ゲーム','6,410件の投稿'],['テクノロジー','生成AI','5,834件の投稿'],['暮らし','週末の過ごし方','2,301件の投稿']];
let composeState=null;
function toast(message){const root=$('#toast-root');root.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>root.innerHTML='',2400)}
function renderNav(){
 $('#side-nav').innerHTML=navItems.map(([id,label,icon])=>`<button class="nav-item ${state.view===id?'active':''}" data-nav="${id}" aria-label="${label}">${ico(icon)}<span class="nav-label">${label}</span>${id==='notifications'&&state.notifications.filter(n=>!state.readNotifications.includes(n.id)).length?`<span class="count">${Math.min(99,state.notifications.filter(n=>!state.readNotifications.includes(n.id)).length)}</span>`:''}</button>`).join('');
 $('#mobile-nav').innerHTML=navItems.filter(x=>['home','explore','notifications','messages','profile'].includes(x[0])).map(([id,label,icon])=>`<button class="${state.view===id?'active':''}" data-nav="${id}" aria-label="${label}" title="${label}">${ico(icon)}</button>`).join('');
 $('#side-avatar').innerHTML=esc(me().initial);$('#side-avatar').style.background=me().color;$('#side-name').textContent=me().name;$('#side-handle').textContent='@'+me().handle;
}
function header(title,back=false){return `<header class="topbar">${back?`<button class="back" data-action="back" aria-label="戻る">${ico('back')}</button>`:''}<h1>${esc(title)}</h1></header>`}
function postActions(p){return `<div class="post-actions"><button class="action" data-action="reply" data-id="${p.id}" aria-label="返信 ${p.replies||0}" title="返信">${ico('reply')}<span>${p.replies?short(p.replies):''}</span></button><button class="action repost ${p.reposted?'active':''}" data-action="repost" data-id="${p.id}" aria-label="リポスト ${p.reposts||0}" aria-pressed="${!!p.reposted}" title="リポスト">${ico('repost')}<span>${p.reposts?short(p.reposts):''}</span></button><button class="action like ${p.liked?'active':''}" data-action="like" data-id="${p.id}" aria-label="いいね ${p.likes||0}" aria-pressed="${!!p.liked}" title="いいね">${ico('heart')}<span>${p.likes?short(p.likes):''}</span></button><button class="action view-action" data-action="views" data-id="${p.id}" aria-label="表示回数 ${p.views||0}" title="表示回数">${ico('chart')}<span>${short(p.views||0)}</span></button><button class="action bookmarked ${p.bookmarked?'active':''}" data-action="bookmark" data-id="${p.id}" aria-label="ブックマーク" aria-pressed="${!!p.bookmarked}" title="ブックマーク">${ico('bookmark')}</button><button class="action" data-action="share" data-id="${p.id}" aria-label="共有" title="共有">${ico('share')}</button></div>`}
function postMedia(p){const media=p.mediaItems?.length?p.mediaItems:(p.media?[p.media]:[]);let html='';if(p.warning)html+=`<div class="content-warning">${esc(p.warning)}</div>`;if(media.length)html+=`<div class="post-media-grid count-${Math.min(media.length,4)}">${media.slice(0,4).map(src=>`<img class="post-media" src="${esc(src)}" alt="投稿画像" loading="lazy" data-action="open-image" data-src="${esc(src)}" onerror="this.style.display='none'">`).join('')}</div>`;if(p.gif)html+=`<div class="gif-preview"><span>GIF</span><strong>${esc(p.gif)}</strong><small>デモ用GIF</small></div>`;if(p.poll)html+=`<div class="poll-card">${p.poll.options.map((option,i)=>{const total=p.poll.votes.reduce((a,b)=>a+b,0);const pct=total?Math.round((p.poll.votes[i]||0)/total*100):0;return `<button class="poll-option ${p.poll.voted===i?'selected':''}" data-action="vote-poll" data-id="${p.id}" data-option="${i}"><span class="poll-bar" style="width:${p.poll.voted===null||p.poll.voted===undefined?0:pct}%"></span><span>${esc(option)}</span>${p.poll.voted!==null&&p.poll.voted!==undefined?`<b>${pct}%</b>`:''}</button>`}).join('')}<small>${p.poll.votes.reduce((a,b)=>a+b,0)}票 · 残り${esc(p.poll.duration||'1日')}</small></div>`;if(p.location)html+=`<div class="post-location">${ico('pin')} ${esc(p.location)}</div>`;return html}
function postHTML(p,options={}){
 const u=user(p.userId);const context=p.repostedBy?`<div class="post-context">${ico('repost')}<span>${esc(user(p.repostedBy).name)}さんがリポスト</span></div>`:'';
 const replyContext=p.replyTo?`<div class="post-context reply-context">返信先: <button data-action="open-post" data-id="${p.replyTo}">@${esc(user(state.posts.find(x=>x.id===p.replyTo)?.userId).handle)}</button></div>`:'';
 return `<article class="post ${options.compact?'compact-post':''}" data-post="${p.id}"><button class="post-avatar-link" data-action="profile-open" data-id="${p.userId}" aria-label="${esc(u.name)}のプロフィール">${avatar(u)}</button><div class="post-main">${context}${replyContext}<div class="post-head"><button class="post-author-link" data-action="profile-open" data-id="${p.userId}"><strong>${esc(u.name)}</strong>${u.verified?`<span class="verified" title="認証済み">✓</span>`:''}<span class="handle">@${esc(u.handle)}</span></button><span class="dot">·</span><button class="time-link" data-action="open-post" data-id="${p.id}" title="${fullDate(p.createdAt)}">${timeAgo(p.createdAt)}</button><button class="post-menu" data-action="post-menu" data-id="${p.id}" aria-label="その他">${ico('more')}</button></div><div class="post-text" data-action="open-post" data-id="${p.id}">${rich(p.text)}</div>${postMedia(p)}${postActions(p)}</div></article>`;
}
function feedPosts(list){return list.length?list.map(p=>postHTML(p)).join(''):`<div class="empty"><h2>まだ投稿がありません</h2><p>気になる人をフォローしたり、最初の投稿をしてみましょう。</p><button class="primary" data-action="open-compose">ポストする</button></div>`}
function composer(){return `<section class="composer home-composer">${avatar(me())}<div class="composer-body"><textarea id="quick-compose" maxlength="280" placeholder="いまどうしてる？" aria-label="ポスト本文">${esc(state.draft||'')}</textarea><div class="composer-tools"><button class="tool-btn" data-action="open-compose" data-tool="image" title="画像や動画を追加" aria-label="画像や動画を追加">${ico('image')}</button><button class="tool-btn" data-action="open-compose" data-tool="gif" title="GIFを追加" aria-label="GIFを追加">${ico('gif')}</button><button class="tool-btn" data-action="open-compose" data-tool="poll" title="投票を追加" aria-label="投票を追加">${ico('poll')}</button><button class="tool-btn" data-action="open-compose" data-tool="emoji" title="絵文字を追加" aria-label="絵文字を追加">${ico('smile')}</button><button class="tool-btn" data-action="open-compose" data-tool="schedule" title="予約投稿" aria-label="予約投稿">${ico('calendar')}</button><button class="tool-btn" data-action="open-compose" data-tool="location" title="位置情報を追加" aria-label="位置情報を追加">${ico('pin')}</button><span class="composer-spacer"></span><button class="primary" data-action="quick-post" id="quick-post" ${state.draft?.trim()?'':'disabled'}>ポストする</button></div></div></section>`}
function renderHome(){const posts=state.posts.filter(p=>!p.replyTo).filter(p=>state.timeline==='for-you'||p.userId==='me'||isFollowing(p.userId)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${header('ホーム')}<div class="tabs"><button class="tab ${state.timeline==='for-you'?'active':''}" data-action="timeline" data-value="for-you">おすすめ</button><button class="tab ${state.timeline==='following'?'active':''}" data-action="timeline" data-value="following">フォロー中</button></div>${composer()}${feedPosts(posts)}`}
function renderRight(){const visibleTrends=trends.filter(t=>!state.hiddenTrends.includes(t[1]));const trendHtml=visibleTrends.map(t=>`<div class="trend"><a href="#explore" data-trend="${esc(t[1])}"><small>${esc(t[0])} · トレンド</small><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></a><button class="trend-more" data-action="trend-menu" data-value="${esc(t[1])}" aria-label="${esc(t[1])}のその他">${ico('more')}</button></div>`).join('');const suggestions=state.users.filter(u=>u.id!=='me'&&!isFollowing(u.id)).slice(0,3).map(u=>`<div class="suggestion">${avatar(u,'sm')}<div class="suggestion-info"><strong>${esc(u.name)}${u.verified?' <span class="verified">✓</span>':''}</strong><small>@${esc(u.handle)}</small></div><button class="follow-btn" data-action="follow" data-id="${u.id}">フォロー</button></div>`).join('');return `<label class="searchbox">${ico('search')}<input id="global-search" placeholder="キーワードを検索" aria-label="キーワードを検索"></label><section class="right-card"><h2>いま話題のトピック</h2>${trendHtml||'<div class="trend muted">表示できるトレンドはありません</div>'}<button class="show-more" data-nav="explore">さらに表示</button></section><section class="right-card"><h2>おすすめユーザー</h2>${suggestions||'<div class="trend muted">新しいおすすめはありません</div>'}<button class="show-more" data-nav="explore">もっと見る</button></section><div class="footer"><a href="#">利用規約</a><a href="#">プライバシー</a><a href="#">Cookie</a><a href="#">アクセシビリティ</a><a href="#">広告について</a><br>© 2026 Orbit</div>`}
function renderExplore(){return `${header('話題を検索')}<div class="search-page"><label class="search-inline">${ico('search')}<input id="search-input" value="${esc(state.searchTerm)}" placeholder="キーワードを検索"></label></div><div class="search-filters">${[['posts','投稿'],['people','ユーザー'],['trending','トレンド']].map(([id,t])=>`<button class="${state.searchFilter===id?'active':''}" data-action="search-filter" data-value="${id}">${t}</button>`).join('')}</div><div id="search-results">${searchResults()}</div>`}
function searchResults(){const q=state.searchTerm.trim().toLowerCase();if(state.searchFilter==='trending')return trends.filter(t=>!state.hiddenTrends.includes(t[1])).map((t,i)=>`<div class="trend search-trend"><small>${esc(t[0])} · トレンド ${i+1}位</small><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></div>`).join('')||'<div class="empty"><h2>トレンドはありません</h2></div>';if(state.searchFilter==='people'){const users=state.users.filter(u=>!q||(u.name+' '+u.handle+' '+u.bio).toLowerCase().includes(q));return users.length?users.map(u=>`<div class="suggestion">${avatar(u)}<div class="suggestion-info"><strong>${esc(u.name)} ${u.verified?'<span class="verified">✓</span>':''}</strong><small>@${esc(u.handle)}</small><small>${esc(u.bio)}</small></div>${u.id==='me'?'':`<button class="follow-btn ${isFollowing(u.id)?'following':''}" data-action="follow" data-id="${u.id}">${isFollowing(u.id)?'フォロー中':'フォロー'}</button>`}</div>`).join(''):`<div class="empty"><h2>ユーザーが見つかりません</h2><p>別のキーワードをお試しください。</p></div>`}const list=state.posts.filter(p=>!p.replyTo&&(!q||(p.text+' '+user(p.userId).name+' '+user(p.userId).handle).toLowerCase().includes(q))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return feedPosts(list)}
function renderNotifications(){const list=state.notifications.filter(n=>state.notifFilter==='all'||(state.notifFilter==='verified'?user(n.from).verified:(state.notifFilter==='mentions'&&(n.type==='reply'||n.type==='mention')))).sort((a,b)=>new Date(b.at)-new Date(a.at));return `${header('通知')}<div class="tabs"><button class="tab ${state.notifFilter==='all'?'active':''}" data-action="notif-filter" data-value="all">すべて</button><button class="tab ${state.notifFilter==='verified'?'active':''}" data-action="notif-filter" data-value="verified">認証済み</button><button class="tab ${state.notifFilter==='mentions'?'active':''}" data-action="notif-filter" data-value="mentions">メンション</button></div>${list.length?list.map(n=>{const u=user(n.from);const symbol=n.type==='like'?'heart':n.type==='follow'?'user':n.type==='reply'||n.type==='mention'?'reply':'repost';return `<div class="notification ${state.readNotifications.includes(n.id)?'read':''}" data-action="notification-open" data-id="${n.id}"><div class="notification-icon">${ico(symbol)}</div><div class="notification-content">${avatar(u,'sm')}<div><strong>${esc(u.name)}</strong>${u.verified?'<span class="verified">✓</span>':''}${esc(n.text)}</div>${n.detail?`<p>${esc(n.detail)}</p>`:''}<small class="muted">${timeAgo(n.at)}前</small></div></div>`}).join(''):`<div class="empty"><h2>通知はまだありません</h2><p>誰かがあなたのポストに反応すると、ここに表示されます。</p></div>`}`}
function renderMessages(){const convos=state.messages.slice().sort((a,b)=>new Date(b.messages.at(-1)?.at||0)-new Date(a.messages.at(-1)?.at||0));const selected=convos.find(c=>c.id===state.selectedChat)||convos[0];return `${header('メッセージ')}<div class="message-layout ${selected?'show-chat':''}"><div class="message-list"><div class="message-list-head">メッセージ <button class="icon-btn" data-action="new-message" aria-label="新しいメッセージ">${ico('mail')}</button></div>${convos.map(c=>{const u=user(c.userId),last=c.messages.at(-1);return `<button class="thread-item ${selected&&selected.id===c.id?'active':''}" data-action="select-chat" data-id="${c.id}">${avatar(u,'sm')}<span class="thread-meta"><strong>${esc(u.name)}</strong><small>${esc(last?.text||'')}</small></span></button>`}).join('')}</div><div class="chat">${selected?`<div class="chat-head"><button class="back mobile-title" data-action="back-messages" aria-label="会話一覧へ">${ico('back')}</button>${avatar(user(selected.userId),'sm')} <strong>${esc(user(selected.userId).name)}</strong><button class="icon-btn chat-more" data-action="chat-menu" aria-label="会話のその他">${ico('more')}</button></div><div class="chat-body" id="chat-body">${selected.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${esc(m.text)}<small>${timeAgo(m.at)}前</small></div>`).join('')}</div><form class="chat-compose" id="chat-form"><input id="chat-input" placeholder="メッセージを入力" autocomplete="off" aria-label="メッセージ"><button class="primary" type="submit">送信</button></form>`:`<div class="empty"><h2>メッセージを送信しましょう</h2><p>会話したい相手を選択してください。</p></div>`}</div></div>`}
function renderBookmarks(){return `${header('ブックマーク')}<div class="page-intro"><h2>ブックマーク</h2><p>保存したポストは自分だけが見ることができます。</p></div>${feedPosts(state.posts.filter(p=>p.bookmarked))}`}
function renderLists(){return `${header('リスト')}<div class="page-intro"><h2>リスト</h2><p>興味のあるアカウントをテーマごとに整理できます。</p><button class="primary" style="margin-top:12px" data-action="create-list">新しいリスト</button></div>${state.lists.map(l=>`<button class="list-row" data-action="open-list" data-id="${l.id}">${ico('list')}<span class="list-info"><strong>${esc(l.name)}</strong><small>${esc(l.description)} · ${l.members.length}人</small></span>${ico('back')}</button>`).join('')}`}
function renderProfile(id='me'){const u=user(id);const own=id==='me';let posts=state.posts.filter(p=>p.userId===id&&!p.replyTo);if(state.profileTab==='likes')posts=state.posts.filter(p=>p.liked);if(state.profileTab==='media')posts=posts.filter(p=>p.media||p.mediaItems?.length);if(state.profileTab==='replies')posts=state.posts.filter(p=>p.userId===id&&p.replyTo);return `${header(u.name,!own)}<div class="profile-cover"></div><div class="profile-top"><div class="profile-row">${avatar(u,'lg')}<div class="profile-actions">${own?`<button class="follow-btn following" data-action="edit-profile">プロフィールを編集</button>`:`<button class="follow-btn ${isFollowing(id)?'following':''}" data-action="follow" data-id="${id}">${isFollowing(id)?'フォロー中':'フォロー'}</button><button class="icon-btn" data-action="message-user" data-id="${id}" aria-label="メッセージ">${ico('mail')}</button>`}</div></div><div class="profile-name">${esc(u.name)} ${u.verified?'<span class="verified">✓</span>':''}</div><div class="profile-handle">@${esc(u.handle)}</div><div class="profile-bio">${esc(u.bio)}</div><div class="profile-detail">${u.location?`<span>${ico('pin')} ${esc(u.location)}</span>`:''}${u.website?`<span>${ico('share')} ${esc(u.website)}</span>`:''}<span>${ico('calendar')} ${esc(u.joined)}から利用</span></div><div class="profile-stats"><a href="#" data-action="show-followers" data-type="following" data-id="${id}"><b>${short((id==='me'?(u.following??state.following.length):(u.following??0)))}</b> <span>フォロー中</span></a><a href="#" data-action="show-followers" data-type="followers" data-id="${id}"><b>${short(u.followers)}</b> <span>フォロワー</span></a></div></div><div class="profile-tabs">${[['posts','ポスト'],['replies','返信'],['media','メディア'],['likes','いいね']].map(([key,label])=>`<button class="${state.profileTab===key?'active':''}" data-action="profile-tab" data-value="${key}">${label}</button>`).join('')}</div>${feedPosts(posts)}`}
function renderSettings(){return `${header('設定')}<div class="page-intro"><h2>アカウント設定</h2><p>設定内容はこのブラウザ内に保存されます。</p></div><section class="settings-section"><h3>プロフィール</h3><p class="muted">表示名、ユーザー名、自己紹介を編集できます。</p><button class="primary" data-action="edit-profile">プロフィールを編集</button></section><section class="settings-section"><h3>データ</h3><p class="muted">ポストやフォローなどのデモデータを初期状態に戻します。</p><button class="follow-btn following" data-action="reset">デモデータをリセット</button></section><section class="settings-section"><h3>このデモについて</h3><p class="muted">Orbitは架空のSNSです。サーバーへの送信や実際のアカウント登録は行いません。データはブラウザのローカルストレージに保存されます。</p></section>`}
function renderDetail(){const p=state.posts.find(x=>x.id===state.postId);if(!p)return `${header('ポスト',true)}<div class="empty"><h2>このポストは表示できません</h2><button class="primary" data-action="back">戻る</button></div>`;const parent=p.replyTo?state.posts.find(x=>x.id===p.replyTo):null;const author=user(p.userId);const replies=state.posts.filter(x=>x.replyTo===p.id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));return `${header('ポスト',true)}<div class="detail-page">${parent?`<div class="conversation-parent"><div class="conversation-line"></div>${postHTML(parent,{compact:true})}<div class="replying-context">${ico('reply')} <span>返信先: <button data-action="profile-open" data-id="${parent.userId}">@${esc(user(parent.userId).handle)}</button></span></div></div>`:''}<article class="detail-post" data-post="${p.id}"><div class="detail-author"><button class="post-avatar-link" data-action="profile-open" data-id="${p.userId}">${avatar(author)}</button><div class="detail-author-meta"><button class="post-author-link" data-action="profile-open" data-id="${p.userId}"><strong>${esc(author.name)}</strong>${author.verified?'<span class="verified">✓</span>':''}</button><span class="handle">@${esc(author.handle)}</span></div><button class="post-menu" data-action="post-menu" data-id="${p.id}" aria-label="その他">${ico('more')}</button></div><div class="detail-text">${rich(p.text)}</div>${postMedia(p)}<div class="detail-datetime">${fullDate(p.createdAt)} · Orbit Web</div><div class="detail-views"><strong>${short(p.views||0)}</strong> <span>件の表示</span></div><div class="detail-metrics"><button data-action="show-post-engagement" data-id="${p.id}" data-type="reposts"><b>${short(p.reposts||0)}</b> リポスト</button><button data-action="show-post-engagement" data-id="${p.id}" data-type="likes"><b>${short(p.likes||0)}</b> いいね</button></div>${postActions(p)}</article><section class="detail-reply-composer"><div class="replying-as">返信先: <button data-action="profile-open" data-id="${p.userId}">@${esc(author.handle)}</button></div><div class="reply-composer-row">${avatar(me())}<div class="reply-composer-main"><textarea id="detail-reply" maxlength="280" placeholder="返信をポストする" aria-label="返信をポストする"></textarea><div class="reply-composer-footer"><div class="composer-tools-small"><button class="tool-btn" data-action="reply-tool" data-id="${p.id}" data-tool="image" title="画像を追加" aria-label="画像を追加">${ico('image')}</button><button class="tool-btn" data-action="reply-tool" data-id="${p.id}" data-tool="gif" title="GIFを追加" aria-label="GIFを追加">${ico('gif')}</button><button class="tool-btn" data-action="reply-tool" data-id="${p.id}" data-tool="emoji" title="絵文字を追加" aria-label="絵文字を追加">${ico('smile')}</button></div><div class="detail-reply-controls"><small id="detail-reply-count">0/280</small><button class="primary" data-action="submit-detail-reply" data-id="${p.id}" disabled>返信</button></div></div></div></div></section><div class="replies-heading"><strong>返信</strong></div>${replies.length?replies.map(r=>renderReplyBranch(r,0)).join(''):`<div class="empty replies-empty"><p>まだ返信はありません。最初の返信をしてみましょう。</p></div>`}</div>`}
function renderReplyBranch(p,depth){const children=state.posts.filter(x=>x.replyTo===p.id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));return `<div class="reply-branch depth-${Math.min(depth,2)}">${postHTML(p,{compact:true})}${children.length?`<div class="reply-children">${children.map(c=>renderReplyBranch(c,depth+1)).join('')}</div>`:''}</div>`}
function render(){renderNav();const view=state.view;document.body.dataset.view=view;let html=view==='home'?renderHome():view==='explore'?renderExplore():view==='notifications'?renderNotifications():view==='messages'?renderMessages():view==='bookmarks'?renderBookmarks():view==='lists'?renderLists():view==='profile'?renderProfile(state.profileId||'me'):view==='settings'?renderSettings():view==='post'?renderDetail():renderHome();$('#main').innerHTML=html;$('#right').innerHTML=renderRight();if(view==='messages')requestAnimationFrame(()=>{const b=$('#chat-body');if(b)b.scrollTop=b.scrollHeight});save()}
function navigate(view,extra={}){if(state.view!==view||(view==='profile'&&state.profileId!==extra.profileId)){state.history.push({view:state.view,postId:state.postId,profileId:state.profileId});}state.view=view;Object.assign(state,extra);render();window.scrollTo(0,0)}
function goBack(){const previous=state.history.pop();if(previous){state.view=previous.view||'home';state.postId=previous.postId||null;state.profileId=previous.profileId||'me'}else{state.view='home';state.postId=null;state.profileId='me'}render();window.scrollTo(0,0)}
function openPost(id){if(!state.posts.some(x=>x.id===id))return;if(state.view!=='post'||state.postId!==id)state.history.push({view:state.view,postId:state.postId,profileId:state.profileId});state.postId=id;state.view='post';render();window.scrollTo(0,0)}
function openModal(html,options={}){const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><section class="modal ${options.className||''}" role="dialog" aria-modal="true" aria-label="${esc(options.label||'ダイアログ')}">${html}</section></div>`;const focusTarget=$('textarea',root)||$('input',root);if(focusTarget)requestAnimationFrame(()=>focusTarget.focus())}
function closeModal(){composeState=null;$('#modal-root').innerHTML='';}
function updateComposeCount(){const t=$('#modal-text');if(t){$('#modal-count').textContent=t.value.length+'/280';const button=$('[data-action="submit-compose"]');if(button)button.disabled=!t.value.trim()&&!composeState?.media.length&&!composeState?.gif&&!composeState?.poll;}}
function composeModal(replyId=null,feature=null){const target=replyId?state.posts.find(p=>p.id===replyId):null;composeState={replyId:target?.id||null,text:state.draft||'',media:[],gif:'',poll:null,warning:'',location:'',schedule:'',permission:'everyone'};const permissions=[['everyone','全員が返信できます'],['following','フォローしているアカウント'],['mentioned','@ポストしたアカウントのみ']];const tools=[['image','image','画像や動画を追加'],['gif','gif','GIF画像を追加'],['poll','poll','投票を追加'],['emoji','smile','絵文字を追加'],['schedule','calendar','ポストを予約'],['location','pin','位置情報を追加'],['warning','warning','コンテンツの警告']];openModal(`<div class="modal-head compose-modal-head"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">${ico('close')}</button><h2>ポストする</h2></div><div class="modal-compose"><div class="compose-avatar">${avatar(me())}</div><div class="compose-main">${target?`<div class="replying-to">返信先: <button data-action="profile-open" data-id="${target.userId}">@${esc(user(target.userId).handle)}</button></div>`:''}<textarea id="modal-text" maxlength="280" placeholder="いまどうしてる？" aria-label="ポスト本文">${esc(composeState.text)}</textarea><div id="compose-extras"></div><div class="compose-permission-wrap"><button class="compose-permission" data-action="toggle-permissions">${ico('globe')} <span>全員が返信できます</span> ${ico('back')}</button><div class="permission-menu hidden" id="permission-menu">${permissions.map(([value,label])=>`<button data-action="set-permission" data-value="${value}"><span>${esc(label)}</span>${value==='everyone'?'<small>誰でも返信できます</small>':value==='following'?'<small>フォロー中のアカウントが返信できます</small>':'<small>メンションした相手だけが返信できます</small>'}</button>`).join('')}</div></div><div class="modal-footer"><div class="compose-toolbar">${tools.map(([action,icon,label])=>`<button class="tool-btn" data-action="compose-tool" data-tool="${action}" title="${label}" aria-label="${label}">${ico(icon)}</button>`).join('')}</div><div class="compose-submit"><small id="modal-count">${composeState.text.length}/280</small><button class="primary" data-action="submit-compose" data-reply="${target?.id||''}" ${composeState.text.trim()?'':'disabled'}>${target?'返信':'ポストする'}</button></div></div><input type="file" id="media-file" accept="image/*" multiple hidden></div></div>`,{className:'compose-modal',label:target?'返信':'ポストする'});if(feature)composeTool(feature);updateComposeCount()}
function composeTool(tool){if(!composeState)return;if(tool==='image'){$('#media-file')?.click();return}const extras=$('#compose-extras');if(!extras)return;if(tool==='gif'){extras.innerHTML=`<div class="compose-tool-panel"><strong>GIFを選択</strong><div class="gif-choices">${['👏 拍手','😂 笑い','🎉 お祝い','🐱 ねこ'].map(v=>`<button data-action="select-gif" data-value="${v}">${v}</button>`).join('')}</div></div>`;return}if(tool==='poll'){composeState.poll=composeState.poll||['',''];extras.innerHTML=`<div class="compose-tool-panel poll-editor"><label><input data-poll-option="0" maxlength="25" placeholder="選択肢1" value="${esc(composeState.poll[0])}"></label><label><input data-poll-option="1" maxlength="25" placeholder="選択肢2" value="${esc(composeState.poll[1])}"></label><button data-action="add-poll-option">選択肢を追加</button><select id="poll-duration"><option value="1日">1日</option><option value="3日">3日</option><option value="7日">7日</option></select></div>`;updateComposeCount();return}if(tool==='emoji'){extras.innerHTML=`<div class="emoji-picker">${['😀','😊','😂','🥹','❤️','✨','🎉','☕','🌱','👍','🙌','🐈'].map(v=>`<button data-action="insert-emoji" data-value="${v}">${v}</button>`).join('')}</div>`;return}if(tool==='schedule'){extras.innerHTML=`<div class="compose-tool-panel"><label>予約日時 <input type="datetime-local" id="schedule-at" min="${new Date(Date.now()+60000).toISOString().slice(0,16)}"></label></div>`;return}if(tool==='location'){composeState.location=composeState.location?'':'';extras.innerHTML=`<div class="compose-tool-panel"><label>位置情報 <input id="location-value" maxlength="40" placeholder="例：東京都渋谷区"></label><button data-action="save-location">設定</button></div>`;return}if(tool==='warning'){extras.innerHTML=`<div class="compose-tool-panel"><label>コンテンツの警告 <input id="warning-value" maxlength="60" placeholder="例：ネタバレを含みます"></label><button data-action="save-warning">設定</button></div>`;return}}
function addPost(text,replyTo=null,extras={}){const clean=(text||'').trim();const media=extras.media||[];if(!clean&&!media.length&&!extras.gif&&!extras.poll){toast('ポスト本文を入力してください');return false}const poll=extras.poll?{options:extras.poll,votes:extras.poll.map(()=>0),voted:null,duration:extras.pollDuration||'1日'}:null;const p={id:'p'+Math.random().toString(36).slice(2,10),userId:'me',text:clean,createdAt:new Date().toISOString(),likes:0,reposts:0,replies:0,views:1,liked:false,reposted:false,bookmarked:false,media:media[0]||'',mediaItems:media,gif:extras.gif||'',poll,warning:extras.warning||'',location:extras.location||'',replyPermission:extras.permission||'everyone',replyTo:replyTo||null};state.posts.unshift(p);state.draft='';if(replyTo){const parent=state.posts.find(x=>x.id===replyTo);if(parent)parent.replies=(parent.replies||0)+1;state.notifications.unshift({id:'n'+Date.now(),type:'reply',from:'me',text:'さんがポストに返信しました。',at:new Date().toISOString(),postId:replyTo,detail:clean});closeModal();state.postId=replyTo;state.view='post';render();window.scrollTo(0,0);toast('返信しました')}else if(extras.schedule){state.scheduledPosts.push({...p,scheduledAt:extras.schedule});state.posts=state.posts.filter(x=>x.id!==p.id);closeModal();render();toast('ポストを予約しました')}else{closeModal();state.view='home';state.timeline='for-you';render();toast('ポストしました')}save();return true}
function openPostMenu(id){const p=state.posts.find(x=>x.id===id);if(!p)return;openModal(`<div class="post-menu-list"><button data-action="close-modal" class="menu-close">${ico('close')}<span>閉じる</span></button><button data-action="share" data-id="${id}">${ico('share')}<span>ポストを共有</span></button>${p.userId==='me'?`<button class="danger" data-action="delete-post" data-id="${id}">${ico('close')}<span>ポストを削除</span></button>`:`<button data-action="report-post" data-id="${id}">${ico('warning')}<span>ポストを報告</span></button><button data-action="mute-user" data-id="${p.userId}">${ico('bell')}<span>@${esc(user(p.userId).handle)}をミュート</span></button>`}</div>`,{className:'menu-modal',label:'ポストメニュー'})}
function openProfileModal(id){const type=id;const list=type==='following'?state.following:state.users.filter(u=>u.id!=='me').slice(0,Math.min(4,state.users.length));openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">${ico('close')}</button><h2>${type==='following'?'フォロー中':'フォロワー'}</h2></div><div class="people-list">${list.length?list.map(uid=>{const u=user(uid);return `<div class="suggestion">${avatar(u)}<div class="suggestion-info"><strong>${esc(u.name)}</strong><small>@${esc(u.handle)}</small></div>${u.id==='me'?'':`<button class="follow-btn ${isFollowing(u.id)?'following':''}" data-action="follow" data-id="${u.id}">${isFollowing(u.id)?'フォロー中':'フォロー'}</button>`}</div>`}).join(''):'<div class="empty"><p>表示できるアカウントはありません。</p></div>'}</div>`,{label:type==='following'?'フォロー中':'フォロワー'})}
function showEngagement(id,type){const p=state.posts.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>${type==='likes'?'いいね':'リポスト'}</h2></div><div class="page-intro"><p>${type==='likes'?short(p.likes)+'件のいいね':short(p.reposts)+'件のリポスト'}</p></div><div class="suggestion">${avatar(user(p.userId))}<div class="suggestion-info"><strong>${esc(user(p.userId).name)}</strong><small>@${esc(user(p.userId).handle)}</small></div></div>`,{label:type==='likes'?'いいね':'リポスト'})}
function togglePost(id,key,num){const p=state.posts.find(x=>x.id===id);if(!p)return;const next=!p[key];p[key]=next;if(num)p[num]=Math.max(0,(p[num]||0)+(next?1:-1));if(key==='liked'&&next&&p.userId==='me'){}save();render()}
function follow(id){if(!id||id==='me')return;if(isFollowing(id)){state.following=state.following.filter(x=>x!==id);user(id).followers=Math.max(0,(user(id).followers||0)-1);me().following=Math.max(0,(me().following||0)-1);toast('フォローを解除しました')}else{state.following.push(id);user(id).followers=(user(id).followers||0)+1;me().following=(me().following||0)+1;state.notifications.unshift({id:'n'+Date.now(),type:'follow',from:id,text:'さんにフォローされました。',at:new Date().toISOString()});toast('フォローしました')}save();render()}
function doSearch(q){state.searchTerm=q||'';state.view='explore';state.searchFilter='posts';render();$('#search-input')?.focus()}
function makeConversation(id){if(!id||id==='me')return;let c=state.messages.find(c=>c.userId===id);if(!c){c={id:'m'+Date.now(),userId:id,messages:[]};state.messages.unshift(c)}state.selectedChat=c.id;state.view='messages';render()}
function createList(){openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>新しいリスト</h2></div><div class="form-modal-body"><label class="field"><span>リスト名</span><input id="list-name" maxlength="40" placeholder="例：デザイン関連"></label><label class="field"><span>説明</span><textarea id="list-description" maxlength="160" placeholder="このリストについて"></textarea></label><button class="primary" data-action="save-list">作成する</button></div>`,{label:'新しいリスト'})}
function openList(id){const l=state.lists.find(x=>x.id===id);if(!l)return;openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>${esc(l.name)}</h2></div><div class="page-intro"><p>${esc(l.description)}</p></div>${l.members.map(uid=>{const u=user(uid);return `<div class="suggestion">${avatar(u,'sm')}<div class="suggestion-info"><strong>${esc(u.name)}</strong><small>@${esc(u.handle)}</small></div><button class="follow-btn following" data-action="remove-list-member" data-list="${id}" data-id="${uid}">削除</button></div>`}).join('')}<div class="form-modal-body"><select id="list-member">${state.users.filter(u=>u.id!=='me'&&!l.members.includes(u.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="primary" data-action="add-list-member" data-id="${id}">メンバーを追加</button></div>`,{label:l.name})}
function editProfile(){const u=me();openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>プロフィールを編集</h2><span class="compose-spacer"></span><button class="primary" data-action="save-profile">保存</button></div><div class="form-modal-body"><label class="field"><span>表示名</span><input id="edit-name" maxlength="50" value="${esc(u.name)}"></label><label class="field"><span>ユーザー名</span><input id="edit-handle" maxlength="15" value="${esc(u.handle)}"></label><label class="field"><span>自己紹介</span><textarea id="edit-bio" maxlength="160">${esc(u.bio)}</textarea></label><label class="field"><span>場所</span><input id="edit-location" maxlength="40" value="${esc(u.location)}"></label><label class="field"><span>ウェブサイト</span><input id="edit-website" maxlength="100" value="${esc(u.website)}"></label></div>`,{label:'プロフィールを編集'})}
function action(el,event){const a=el.dataset.action,id=el.dataset.id,val=el.dataset.value;switch(a){
 case'open-compose':composeModal(null,el.dataset.tool||null);break;
 case'reply-tool':{const draft=$('#detail-reply')?.value||'';composeModal(id,el.dataset.tool||null);const target=$('#modal-text');if(target){target.value=draft;if(composeState)composeState.text=draft;updateComposeCount()}break}
 case'quick-post':addPost($('#quick-compose')?.value||'',null,{});break;
 case'timeline':state.timeline=val;render();break;
 case'like':togglePost(id,'liked','likes');break;
 case'repost':togglePost(id,'reposted','reposts');break;
 case'bookmark':{const p=state.posts.find(x=>x.id===id);if(p){p.bookmarked=!p.bookmarked;save();render();toast(p.bookmarked?'ブックマークに追加しました':'ブックマークを解除しました')}break}
 case'reply':composeModal(id);break;
 case'open-post':openPost(id);break;
 case'profile-open':state.history.push({view:state.view,postId:state.postId,profileId:state.profileId});state.view='profile';state.profileId=id;state.profileTab='posts';render();window.scrollTo(0,0);break;
 case'post-menu':openPostMenu(id);break;
 case'share':{const link=location.href.split('#')[0]+'#post-'+id;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(link).then(()=>toast('リンクをコピーしました')).catch(()=>toast('共有リンク: '+link))}else{const box=document.createElement('textarea');box.value=link;document.body.append(box);box.select();try{document.execCommand('copy');toast('リンクをコピーしました')}catch{toast('共有リンク: '+link)}box.remove()}closeModal();break}
 case'follow':follow(id);break;
 case'notification-open':{const n=state.notifications.find(x=>x.id===id);if(n){if(!state.readNotifications.includes(id))state.readNotifications.push(id);save();if(n.postId)openPost(n.postId);else{state.history.push({view:state.view});state.view='profile';state.profileId=n.from;render()}}break}
 case'notif-filter':state.notifFilter=val;render();break;
 case'search-filter':state.searchFilter=val;render();break;
 case'profile-tab':state.profileTab=val;render();break;
 case'edit-profile':editProfile();break;
 case'close-modal':closeModal();break;
 case'close-backdrop':if(el===event.target)closeModal();break;
 case'compose-tool':composeTool(el.dataset.tool);break;
 case'attach-image':$('#media-file')?.click();break;
 case'toggle-permissions':$('#permission-menu')?.classList.toggle('hidden');break;
 case'set-permission':if(composeState){composeState.permission=val;const labels={everyone:'全員が返信できます',following:'フォローしているアカウント',mentioned:'@ポストしたアカウントのみ'};$('.compose-permission span').textContent=labels[val];$('#permission-menu')?.classList.add('hidden')}break;
 case'select-gif':if(composeState){composeState.gif=val;$('#compose-extras').innerHTML=`<div class="selected-gif">GIFを添付: ${esc(val)} <button data-action="remove-gif" aria-label="GIFを削除">${ico('close')}</button></div>`;updateComposeCount()}break;
 case'remove-gif':if(composeState){composeState.gif='';$('#compose-extras').innerHTML='';updateComposeCount()}break;
 case'insert-emoji':{const t=$('#modal-text');if(t){const start=t.selectionStart,end=t.selectionEnd;t.setRangeText(val,start,end,'end');t.focus();composeState.text=t.value;updateComposeCount()}else{const q=$('#detail-reply');if(q){q.value+=val;updateDetailCount()}}break}
 case'add-poll-option':if(composeState?.poll&&composeState.poll.length<4){composeState.poll.push('');composeTool('poll');}break;
 case'save-location':if(composeState){composeState.location=$('#location-value')?.value.trim()||'';$('#compose-extras').innerHTML=composeState.location?`<div class="selected-meta">${ico('pin')} ${esc(composeState.location)} <button data-action="remove-location">削除</button></div>`:''}break;
 case'remove-location':if(composeState){composeState.location='';$('#compose-extras').innerHTML=''}break;
 case'save-warning':if(composeState){composeState.warning=$('#warning-value')?.value.trim()||'';$('#compose-extras').innerHTML=composeState.warning?`<div class="selected-meta">${ico('warning')} ${esc(composeState.warning)} <button data-action="remove-warning">削除</button></div>`:''}break;
 case'remove-warning':if(composeState){composeState.warning='';$('#compose-extras').innerHTML=''}break;
 case'submit-compose':{if(composeState?.poll){composeState.poll=$$('[data-poll-option]').map(x=>x.value.trim()).filter(Boolean);if(composeState.poll.length<2){toast('投票の選択肢を2つ以上入力してください');break}}const schedule=$('#schedule-at')?.value||'';if(schedule&&new Date(schedule)<=new Date()){toast('未来の日時を指定してください');break}const duration=$('#poll-duration')?.value||'1日';addPost($('#modal-text')?.value||'',composeState?.replyId,{media:composeState?.media||[],gif:composeState?.gif||'',poll:composeState?.poll?.length?composeState.poll:null,pollDuration:duration,warning:composeState?.warning||'',location:composeState?.location||'',schedule,permission:composeState?.permission});break}
 case'submit-detail-reply':{const text=$('#detail-reply')?.value||'';if(!text.trim()){toast('返信を入力してください');break}addPost(text,id,{});break}
 case'create-list':createList();break;
 case'save-list':{const name=$('#list-name')?.value.trim();if(!name){toast('リスト名を入力してください');break}state.lists.push({id:'l'+Date.now(),name,description:$('#list-description')?.value||'',members:[]});closeModal();render();toast('リストを作成しました');break}
 case'open-list':openList(id);break;
 case'add-list-member':{const l=state.lists.find(x=>x.id===id),m=$('#list-member')?.value;if(l&&m&&!l.members.includes(m))l.members.push(m);closeModal();render();toast('メンバーを追加しました');break}
 case'remove-list-member':{const l=state.lists.find(x=>x.id===el.dataset.list);if(l)l.members=l.members.filter(x=>x!==id);closeModal();render();toast('メンバーを削除しました');break}
 case'save-profile':{const u=me();u.name=$('#edit-name')?.value.trim()||u.name;let handle=$('#edit-handle')?.value.trim().replace(/^@/,'')||u.handle;handle=handle.replace(/[^a-zA-Z0-9_]/g,'').slice(0,15);if(!handle){toast('ユーザー名を入力してください');break}if(state.users.some(x=>x.id!=='me'&&x.handle.toLowerCase()===handle.toLowerCase())){toast('このユーザー名は使用されています');break}u.handle=handle;u.bio=$('#edit-bio')?.value||'';u.location=$('#edit-location')?.value||'';u.website=$('#edit-website')?.value||'';closeModal();render();toast('プロフィールを更新しました');break}
 case'select-chat':state.selectedChat=id;render();break;
 case'new-message':openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>新しいメッセージ</h2></div><div class="people-list">${state.users.filter(u=>u.id!=='me').map(u=>`<button class="suggestion" data-action="start-chat" data-id="${u.id}">${avatar(u,'sm')}<span class="suggestion-info"><strong>${esc(u.name)}</strong><small>@${esc(u.handle)}</small></span></button>`).join('')}</div>`,{label:'新しいメッセージ'});break;
 case'start-chat':closeModal();makeConversation(id);break;
 case'message-user':makeConversation(id);break;
 case'back-messages':$('.message-layout')?.classList.remove('show-chat');break;
 case'back':goBack();break;
 case'trend-menu':state.hiddenTrends.push(val);save();render();toast('トレンドを非表示にしました');break;
 case'show-followers':openProfileModal(el.dataset.type);break;
 case'show-post-engagement':showEngagement(id,el.dataset.type);break;
 case'views':{const p=state.posts.find(x=>x.id===id);if(p)openModal(`<div class="modal-head"><button class="icon-btn" data-action="close-modal">${ico('close')}</button><h2>ポストのアナリティクス</h2></div><div class="page-intro"><h2>${short(p.views||0)} 件の表示</h2><p>このデモの表示回数はサンプル値です。</p></div>`,{label:'ポストのアナリティクス'});break}
 case'vote-poll':{const p=state.posts.find(x=>x.id===id);const option=Number(el.dataset.option);if(p?.poll&&p.poll.voted===null){p.poll.voted=option;p.poll.votes[option]=(p.poll.votes[option]||0)+1;save();render()}else toast('投票は1回のみです');break}
 case'delete-post':if(confirm('このポストを削除しますか？')){state.posts=state.posts.filter(p=>p.id!==id&&!isDescendant(p,id));closeModal();render();toast('ポストを削除しました')}break;
 case'report-post':closeModal();toast('報告を受け付けました（デモ）');break;
 case'mute-user':closeModal();toast('@'+user(id).handle+'をミュートしました（デモ）');break;
 case'chat-menu':toast('会話メニュー（デモ）');break;
 case'reset':if(confirm('デモデータを初期状態に戻しますか？')){localStorage.removeItem('orbit-state-v1');location.reload()}break;
 case'open-image':openModal(`<div class="image-viewer"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">${ico('close')}</button><img src="${esc(el.dataset.src)}" alt="投稿画像"></div>`,{className:'image-modal',label:'画像を表示'});break;
 }}
function isDescendant(post,id){let current=post;let steps=0;while(current?.replyTo&&steps++<20){if(current.replyTo===id)return true;current=state.posts.find(x=>x.id===current.replyTo)}return false}
function updateDetailCount(){const t=$('#detail-reply');if(t){$('#detail-reply-count').textContent=t.value.length+'/280';const b=$('[data-action="submit-detail-reply"]');if(b)b.disabled=!t.value.trim()}}
// Event delegation: one listener for the whole app keeps dynamically rendered controls active.
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){event.preventDefault();navigate(nav.dataset.nav,nav.dataset.nav==='profile'?{profileId:'me'}:{});return}const trend=event.target.closest('[data-trend]');if(trend){event.preventDefault();doSearch(trend.dataset.trend);return}const el=event.target.closest('[data-action]');if(el){event.preventDefault();action(el,event);return}const card=event.target.closest('[data-post]');if(card&&!event.target.closest('button,a,textarea,input'))openPost(card.dataset.post)});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='quick-compose'){state.draft=t.value;const b=$('#quick-post');if(b)b.disabled=!t.value.trim();save()}if(t.id==='modal-text'){if(composeState)composeState.text=t.value;updateComposeCount()}if(t.id==='search-input'){state.searchTerm=t.value;const results=$('#search-results');if(results)results.innerHTML=searchResults()}if(t.id==='detail-reply')updateDetailCount();if(t.dataset.pollOption!==undefined&&composeState)composeState.poll[Number(t.dataset.pollOption)]=t.value});
document.addEventListener('change',event=>{if(event.target.id==='media-file'){const files=[...event.target.files||[]];if(!composeState)return;if(composeState.media.length+files.length>4){toast('画像は最大4枚まで添付できます');return}files.forEach(file=>{if(!file.type.startsWith('image/')){toast('画像ファイルを選択してください');return}if(file.size>5*1024*1024){toast('画像は5MB以下のファイルを選択してください');return}const reader=new FileReader();reader.onload=()=>{composeState.media.push(reader.result);renderMediaPreview();updateComposeCount()};reader.readAsDataURL(file)})}if(event.target.id==='schedule-at'&&composeState)composeState.schedule=event.target.value});
function renderMediaPreview(){const extras=$('#compose-extras');if(!extras||!composeState)return;const other=extras.querySelector('.compose-tool-panel');const markup=composeState.media.map((src,i)=>`<div class="media-preview-item"><img src="${src}" alt="添付画像"><button data-action="remove-media" data-index="${i}" aria-label="画像を削除">${ico('close')}</button></div>`).join('');if(markup){let wrap=$('#media-preview-list');if(!wrap){extras.insertAdjacentHTML('afterbegin','<div id="media-preview-list" class="media-preview-list"></div>');wrap=$('#media-preview-list')}wrap.innerHTML=markup}else $('#media-preview-list')?.remove()}
document.addEventListener('click',event=>{const remove=event.target.closest('[data-action="remove-media"]');if(remove&&composeState){composeState.media.splice(Number(remove.dataset.index),1);renderMediaPreview();updateComposeCount()}});
document.addEventListener('keydown',event=>{if(event.target.id==='global-search'&&event.key==='Enter'){event.preventDefault();doSearch(event.target.value);return}if(event.key==='Escape')closeModal();if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){if($('#modal-text'))$('[data-action="submit-compose"]')?.click();else if($('#detail-reply'))$('[data-action="submit-detail-reply"]')?.click()}if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();$('#global-search')?.focus()}});
document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();const input=$('#chat-input'),text=input?.value.trim();if(!text)return;const c=state.messages.find(x=>x.id===state.selectedChat);if(c)c.messages.push({from:'me',text,at:new Date().toISOString()});save();render()}});
window.addEventListener('popstate',()=>{if(state.view==='post')goBack()});
render();
})();

</script>
</body>
