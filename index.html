const safeExternalUrl=(value='')=>{let raw=String(value||'').trim();if(!raw)return '';if(!/^https?:\/\//i.test(raw)){if(/^[a-z][a-z0-9+.-]*:/i.test(raw)&&!/^[a-z0-9.-]+:\d+(?:[/?#]|$)/i.test(raw))return '';raw='https://'+raw}try{const url=new URL(raw);if((url.protocol!=='https:'&&url.protocol!=='http:')||url.username||url.password)return '';return url.href}catch{return ''}};
const rich=s=>esc(s).replace(/(#[\p{L}\p{N}_]+)/gu,'<span class="tag">$1</span>').replace(/(https?:\/\/[^\s]+)/g,'<span class="tag">$1</span>').replace(/(@[a-zA-Z0-9_]+)/g,'<span class="tag">$1</span>');
const avatar=(u,size='')=>{const imageUrl=safeImageUrl(u.avatar_url);return `<span class="avatar ${size}" style="background:${esc(u.color||'#8298aa')}">${imageUrl?`<img src="${esc(imageUrl)}" alt="">`:esc(u.initial||u.name?.slice(0,1)||'?')}</span>`};
const navItems=[['home','ホーム','home'],['explore','話題を検索','search'],['notifications','通知','bell'],['messages','メッセージ','mail'],['bookmarks','ブックマーク','bookmark'],['lists','リスト','list'],['profile','プロフィール','user'],['settings','設定','settings']];
function toast(message){const root=$('#toast-root');root.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>root.innerHTML='',2400)}
function renderNav(){
 const active=state.view;
 $('#side-nav').innerHTML=navItems.map(([id,label,icon])=>`<button class="nav-item ${active===id?'active':''}" data-nav="${esc(id)}" aria-label="${label}" aria-current="${active===id?'page':'false'}">${ico(icon)}<span class="nav-label">${label}</span>${id==='notifications'&&state.notifications.filter(n=>!state.readNotifications.includes(n.id)).length?`<span class="count">${Math.min(99,state.notifications.filter(n=>!state.readNotifications.includes(n.id)).length)}</span>`:''}</button>`).join('');
 $('#mobile-nav').innerHTML=navItems.filter(x=>['home','explore','notifications','messages','profile'].includes(x[0])).map(([id,label,icon])=>`<button class="${active===id?'active':''}" data-nav="${esc(id)}" aria-label="${label}" title="${label}" aria-current="${active===id?'page':'false'}">${ico(icon)}</button>`).join('');
 const sideAvatarUrl=safeImageUrl(me().avatar_url);$('#side-avatar').innerHTML=sideAvatarUrl?`<img src="${esc(sideAvatarUrl)}" alt="">`:esc(me().initial);
 $('#side-avatar').style.background=me().color;
 $('#side-name').textContent=state.authUser?me().name:'ログイン';
 $('#side-handle').textContent=state.authUser?'@'+me().handle:'閲覧モード';
}
function header(title,back=false){return `<header class="topbar">${back?`<button class="back" data-action="back" aria-label="戻る">${ico('back')}</button>`:''}<h1>${esc(title)}</h1></header>`}
function postActions(p){return `<div class="post-actions"><button class="action" data-action="reply" data-id="${esc(p.id)}" aria-label="返信 ${p.replies||0}" title="返信">${ico('reply')}<span>${p.replies?short(p.replies):''}</span></button><button class="action repost ${p.reposted?'active':''}" data-action="repost" data-id="${esc(p.id)}" aria-label="リポスト ${p.reposts||0}" aria-pressed="${!!p.reposted}" title="リポスト">${ico('repost')}<span>${p.reposts?short(p.reposts):''}</span></button><button class="action like ${p.liked?'active':''}" data-action="like" data-id="${esc(p.id)}" aria-label="いいね ${p.likes||0}" aria-pressed="${!!p.liked}" title="いいね">${ico('heart')}<span>${p.likes?short(p.likes):''}</span></button><button class="action view-action" data-action="views" data-id="${esc(p.id)}" aria-label="表示回数 ${p.views||0}" title="表示回数">${ico('chart')}<span>${short(p.views||0)}</span></button><button class="action bookmarked ${p.bookmarked?'active':''}" data-action="bookmark" data-id="${esc(p.id)}" aria-label="ブックマーク" aria-pressed="${!!p.bookmarked}" title="ブックマーク">${ico('bookmark')}</button><button class="action" data-action="share" data-id="${esc(p.id)}" aria-label="共有" title="共有">${ico('share')}</button></div>`}
function postMedia(p){const media=p.mediaItems?.length?p.mediaItems:(p.media?[p.media]:[]);let html='';if(p.warning)html+=`<div class="content-warning">${esc(p.warning)}</div>`;const safeMedia=media.slice(0,4).map(safeImageUrl).filter(Boolean);if(safeMedia.length)html+=`<div class="post-media-grid count-${Math.min(safeMedia.length,4)}">${safeMedia.map(src=>`<img class="post-media" src="${esc(src)}" alt="投稿画像" loading="lazy" data-action="open-image" data-src="${esc(src)}" onerror="this.style.display='none'">`).join('')}</div>`;if(p.gif)html+=`<div class="gif-preview"><span>GIF</span><strong>${esc(p.gif)}</strong><small>デモ用GIF</small></div>`;if(p.poll){const total=p.poll.votes.reduce((a,b)=>a+b,0),expired=!p.poll.expiresAt||Date.parse(p.poll.expiresAt)<=Date.now(),showResults=expired||(p.poll.voted!==null&&p.poll.voted!==undefined);html+=`<div class="poll-card">${p.poll.options.map((option,i)=>{const pct=total?Math.round((p.poll.votes[i]||0)/total*100):0;return `<button class="poll-option ${p.poll.voted===i?'selected':''}" data-action="vote-poll" data-id="${esc(p.id)}" data-option="${i}" ${expired?'disabled':''}><span class="poll-bar" style="width:${showResults?pct:0}%"></span><span>${esc(option)}</span>${showResults?`<b>${pct}%</b>`:''}</button>`}).join('')}<small>${total}票 · ${pollRemainingLabel(p.poll.expiresAt)}</small></div>`}if(p.location)html+=`<div class="post-location">${ico('pin')} ${esc(p.location)}</div>`;return html}
function postHTML(p,options={}){
 const u=user(p.userId);const context=p.repostedBy?`<div class="post-context">${ico('repost')}<span>${esc(user(p.repostedBy).name)}さんがリポスト</span></div>`:'';
 const replyContext=p.replyTo?`<div class="post-context reply-context">返信先: <button data-action="open-post" data-id="${esc(p.replyTo)}">@${esc(user(state.posts.find(x=>x.id===p.replyTo)?.userId).handle)}</button></div>`:'';
 return `<article class="post ${options.compact?'compact-post':''}" data-post="${esc(p.id)}"><button class="post-avatar-link" data-action="profile-open" data-id="${esc(p.userId)}" aria-label="${esc(u.name)}のプロフィール">${avatar(u)}</button><div class="post-main">${context}${replyContext}<div class="post-head"><button class="post-author-link" data-action="profile-open" data-id="${esc(p.userId)}"><strong>${esc(u.name)}</strong>${u.verified?`<span class="verified" title="認証済み">✓</span>`:''}<span class="handle">@${esc(u.handle)}</span></button><span class="dot">·</span><button class="time-link" data-action="open-post" data-id="${esc(p.id)}" title="${fullDate(p.createdAt)}">${timeAgo(p.createdAt)}</button><button class="post-menu" data-action="post-menu" data-id="${esc(p.id)}" aria-label="その他">${ico('more')}</button></div><div class="post-text" data-action="open-post" data-id="${esc(p.id)}">${rich(p.text)}</div>${postMedia(p)}${postActions(p)}</div></article>`;
}
function feedPosts(list){return list.length?list.map(p=>postHTML(p)).join(''):`<div class="empty"><h2>まだ投稿がありません</h2><p>気になる人をフォローしたり、最初の投稿をしてみましょう。</p><button class="primary" data-action="open-compose">ポストする</button></div>`}
function loadMorePostsButton(){return state.hasMorePosts?`<div class="load-more"><button class="show-more" data-action="load-more-posts" ${state.loadingMorePosts?'disabled':''}>${state.loadingMorePosts?'読み込み中…':'さらに読み込む'}</button></div>`:''}
function composer(){return `<section class="composer home-composer">${avatar(me())}<div class="composer-body"><textarea id="quick-compose" maxlength="280" placeholder="いまどうしてる？" aria-label="ポスト本文">${esc(state.draft||'')}</textarea><div class="composer-tools"><button class="tool-btn" data-action="open-compose" data-tool="gif" title="GIFを追加" aria-label="GIFを追加">${ico('gif')}</button><button class="tool-btn" data-action="open-compose" data-tool="poll" title="投票を追加" aria-label="投票を追加">${ico('poll')}</button><button class="tool-btn" data-action="open-compose" data-tool="emoji" title="絵文字を追加" aria-label="絵文字を追加">${ico('smile')}</button><button class="tool-btn" data-action="open-compose" data-tool="schedule" title="予約投稿" aria-label="予約投稿">${ico('calendar')}</button><button class="tool-btn" data-action="open-compose" data-tool="location" title="位置情報を追加" aria-label="位置情報を追加">${ico('pin')}</button><span class="composer-spacer"></span><button class="primary" data-action="quick-post" id="quick-post" ${state.draft?.trim()?'':'disabled'}>ポストする</button></div></div></section>`}
function renderHome(){const posts=state.posts.filter(p=>!p.replyTo&&!state.mutedUsers?.includes(p.userId)).filter(p=>state.timeline==='for-you'||p.userId===me().id||isFollowing(p.userId)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${header('ホーム')}<div class="tabs"><button class="tab ${state.timeline==='for-you'?'active':''}" data-action="timeline" data-value="for-you">おすすめ</button><button class="tab ${state.timeline==='following'?'active':''}" data-action="timeline" data-value="following">フォロー中</button></div>${composer()}${feedPosts(posts)}${loadMorePostsButton()}`}
function renderRight(){
 const visibleTrends=(state.trends||[]).filter(t=>!state.hiddenTrends.includes(t[1]));
 const trendHtml=visibleTrends.map(t=>'<div class="trend"><a href="#explore" data-trend="'+esc(t[1])+'"><small>'+esc(t[0])+' · トレンド</small><strong>'+esc(t[1])+'</strong><small>'+esc(t[2])+'</small></a><button class="trend-more" data-action="trend-menu" data-value="'+esc(t[1])+'" aria-label="'+esc(t[1])+'のその他">'+ico('more')+'</button></div>').join('');
 const suggestions=state.users.filter(u=>u.id!==me().id&&!isFollowing(u.id)&&!state.mutedUsers?.includes(u.id)).slice(0,3).map(u=>'<div class="suggestion">'+avatar(u,'sm')+'<div class="suggestion-info"><strong>'+esc(u.name)+(u.verified?' <span class="verified">✓</span>':'')+'</strong><small>@'+esc(u.handle)+'</small></div><button class="follow-btn" data-action="follow" data-id="'+esc(u.id)+'">フォロー</button></div>').join('');
 return '<label class="searchbox">'+ico('search')+'<input id="global-search" placeholder="キーワードを検索" aria-label="キーワードを検索"></label>'
 + '<section class="right-card"><h2>いま話題のトピック</h2>'+(trendHtml||'<div class="trend muted">表示できるトレンドはありません</div>')+'<button class="show-more" data-nav="explore">さらに表示</button></section>'
 + '<section class="right-card"><h2>おすすめユーザー</h2>'+(suggestions||'<div class="trend muted">新しいおすすめはありません</div>')+'<button class="show-more" data-nav="explore">もっと見る</button></section>'
 + '<div class="footer"><a href="#terms" data-nav="terms">利用規約</a><a href="#privacy" data-nav="privacy">プライバシー</a><a href="#cookies" data-nav="cookies">Cookie</a><a href="#accessibility" data-nav="accessibility">アクセシビリティ</a><a href="#about" data-nav="about">Lime2について</a><br>© 2026 Lime2</div>';
}
function renderExplore(){return `${header('話題を検索')}<div class="search-page"><label class="search-inline">${ico('search')}<input id="search-input" value="${esc(state.searchTerm)}" placeholder="キーワードを検索"></label></div><div class="search-filters">${[['posts','投稿'],['people','ユーザー'],['trending','トレンド']].map(([id,t])=>`<button class="${state.searchFilter===id?'active':''}" data-action="search-filter" data-value="${esc(id)}">${t}</button>`).join('')}</div><div id="search-results">${searchResults()}</div>`}
function searchResults(){const q=state.searchTerm.trim().toLowerCase();if(state.searchFilter==='trending')return state.trends.filter(t=>!state.hiddenTrends.includes(t[1])).map((t,i)=>`<button type="button" class="trend search-trend" data-trend="${esc(t[1])}" aria-label="${esc(t[1])}で検索"><small>${esc(t[0])} · トレンド ${i+1}位</small><strong>${esc(t[1])}</strong><small>${esc(t[2])}</small></button>`).join('')||'<div class="empty"><h2>トレンドはありません</h2></div>';if(state.searchFilter==='people'){const users=state.users.filter(u=>!q||(u.name+' '+u.handle+' '+u.bio).toLowerCase().includes(q));return users.length?users.map(u=>`<div class="suggestion">${avatar(u)}<div class="suggestion-info"><strong>${esc(u.name)} ${u.verified?'<span class="verified">✓</span>':''}</strong><small>@${esc(u.handle)}</small><small>${esc(u.bio)}</small></div>${u.id===me().id?'':`<button class="follow-btn ${isFollowing(u.id)?'following':''}" data-action="follow" data-id="${esc(u.id)}">${isFollowing(u.id)?'フォロー中':'フォロー'}</button>`}</div>`).join(''):`<div class="empty"><h2>ユーザーが見つかりません</h2><p>別のキーワードをお試しください。</p></div>`}const list=state.posts.filter(p=>!p.replyTo&&(!q||(p.text+' '+user(p.userId).name+' '+user(p.userId).handle).toLowerCase().includes(q))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return feedPosts(list)+loadMorePostsButton()}
function renderNotifications(){
 if(!state.authUser)return header('通知')+'<div class="empty"><h2>通知を見るにはログイン</h2><p>フォローやリアクションの通知が届きます。</p><button class="primary" data-action="auth-modal">ログイン / 新規登録</button></div>';
 const list=state.notifications.filter(n=>state.notifFilter==='all'||(state.notifFilter==='verified'?user(n.from).verified:(state.notifFilter==='mentions'&&(n.type==='reply'||n.type==='mention')))).sort((a,b)=>new Date(b.at)-new Date(a.at));
 return header('通知')+'<div class="tabs"><button class="tab '+(state.notifFilter==='all'?'active':'')+'" data-action="notif-filter" data-value="all">すべて</button><button class="tab '+(state.notifFilter==='verified'?'active':'')+'" data-action="notif-filter" data-value="verified">認証済み</button><button class="tab '+(state.notifFilter==='mentions'?'active':'')+'" data-action="notif-filter" data-value="mentions">メンション</button></div>'
 + (list.length?list.map(n=>{const u=user(n.from),symbol=n.type==='like'?'heart':n.type==='follow'?'user':n.type==='reply'||n.type==='mention'?'reply':'repost';return '<div class="notification '+(state.readNotifications.includes(n.id)?'read':'')+'" data-action="notification-open" data-id="'+esc(n.id)+'"><div class="notification-icon">'+ico(symbol)+'</div><div class="notification-content">'+avatar(u,'sm')+'<div><strong>'+esc(u.name)+'</strong>'+(u.verified?'<span class="verified">✓</span>':'')+esc(n.text)+'</div>'+(n.detail?'<p>'+esc(n.detail)+'</p>':'')+'<small class="muted">'+timeAgo(n.at)+'前</small></div></div>'}).join(''):'<div class="empty"><h2>通知はまだありません</h2><p>誰かがあなたのポストに反応すると、ここに表示されます。</p></div>');
}
function renderMessages(){
 if(!state.authUser)return header('メッセージ')+'<div class="empty"><h2>メッセージを利用するにはログイン</h2><p>ログインすると会話の送受信ができます。</p><button class="primary" data-action="auth-modal">ログイン / 新規登録</button></div>';
 const convos=state.messages.slice().sort((a,b)=>new Date(b.messages.at(-1)?.at||0)-new Date(a.messages.at(-1)?.at||0));
 const selected=convos.find(c=>c.id===state.selectedChat)||convos[0];
 return header('メッセージ')+'<div class="message-layout '+(selected?'show-chat':'')+'"><div class="message-list"><div class="message-list-head">メッセージ <button class="icon-btn" data-action="new-message" aria-label="新しいメッセージ">'+ico('mail')+'</button></div>'
 + convos.map(c=>{const u=user(c.userId),last=c.messages.at(-1);return '<button class="thread-item '+(selected&&selected.id===c.id?'active':'')+'" data-action="select-chat" data-id="'+esc(c.id)+'">'+avatar(u,'sm')+'<span class="thread-meta"><strong>'+esc(u.name)+'</strong><small>'+esc(last?.text||'')+'</small></span></button>'}).join('')
 + '</div><div class="chat">'+(selected?'<div class="chat-head"><button class="back mobile-title" data-action="back-messages" aria-label="会話一覧へ">'+ico('back')+'</button>'+avatar(user(selected.userId),'sm')+' <strong>'+esc(user(selected.userId).name)+'</strong><button class="icon-btn chat-more" data-action="chat-menu" aria-label="会話のその他">'+ico('more')+'</button></div><div class="chat-body" id="chat-body">'+selected.messages.map(m=>'<div class="bubble '+(m.from==='me'?'mine':'')+'">'+esc(m.text)+'<small>'+timeAgo(m.at)+'前</small></div>').join('')+'</div><form class="chat-compose" id="chat-form"><input id="chat-input" placeholder="メッセージを入力" autocomplete="off" aria-label="メッセージ"><button class="primary" type="submit">送信</button></form>':'<div class="empty"><h2>メッセージを送信しましょう</h2><p>会話したい相手を選択してください。</p><button class="primary" data-action="new-message">メッセージを作成</button></div>')+'</div></div>';
}
function renderBookmarks(){
 if(!state.authUser)return header('ブックマーク')+'<div class="empty"><h2>ブックマークにはログインが必要です</h2><button class="primary" data-action="auth-modal">ログイン / 新規登録</button></div>';
 return header('ブックマーク')+'<div class="page-intro"><h2>ブックマーク</h2><p>保存したポストは自分だけが見ることができます。</p></div>'+feedPosts(state.posts.filter(p=>p.bookmarked))+loadMorePostsButton();
}
function renderLists(){
 const canManage=!!state.authUser;
 return header('リスト')+'<div class="page-intro"><h2>リスト</h2><p>興味のあるアカウントをテーマごとに整理できます。</p>'+(canManage?'<button class="primary" style="margin-top:12px" data-action="create-list">新しいリスト</button>':'<button class="follow-btn" data-action="auth-modal">ログインしてリストを作成</button>')+'</div>'
 + (state.lists.length
  ? state.lists.map(l=>'<button class="list-row" data-action="open-list" data-id="'+esc(l.id)+'">'+ico('list')+'<span class="list-info"><strong>'+esc(l.name)+'</strong><small>'+esc(l.description)+' · '+l.members.length+'人</small></span>'+ico('back')+'</button>').join('')
  : '<div class="empty"><h2>リストはまだありません</h2><p>気になるアカウントをテーマごとに整理できます。</p></div>');
}
function renderProfile(id){
 const u=user(id),own=id===me().id,canEdit=own&&!!state.authUser,coverUrl=safeImageUrl(u.cover_url),websiteUrl=safeExternalUrl(u.website);
 let posts=state.posts.filter(p=>p.userId===id&&!p.replyTo);
 if(state.profileTab==='likes')posts=state.profileLikesFor===id?(state.profileLikedPosts||[]):[];
 if(state.profileTab==='media')posts=posts.filter(p=>p.media||p.mediaItems?.length);
 if(state.profileTab==='replies')posts=state.posts.filter(p=>p.userId===id&&p.replyTo);
 const actions=canEdit
  ? '<button class="follow-btn following" data-action="edit-profile">プロフィールを編集</button>'
  : own
   ? '<button class="follow-btn" data-action="auth-modal">ログイン</button>'
   : '<button class="follow-btn '+(isFollowing(id)?'following':'')+'" data-action="follow" data-id="'+esc(id)+'">'+(isFollowing(id)?'フォロー中':'フォロー')+'</button><button class="icon-btn" data-action="message-user" data-id="'+esc(id)+'" aria-label="メッセージ">'+ico('mail')+'</button>';
 return header(u.name,!own)
 + '<div class="profile-cover">'+(coverUrl?'<img src="'+esc(coverUrl)+'" alt="">':'')+'</div>'
 + '<div class="profile-top"><div class="profile-row">'+avatar(u,'lg')+'<div class="profile-actions">'+actions+'</div></div>'
 + '<div class="profile-name">'+esc(u.name)+' '+(u.verified?'<span class="verified">✓</span>':'')+'</div>'
 + '<div class="profile-handle">@'+esc(u.handle)+'</div><div class="profile-bio">'+esc(u.bio)+'</div>'
 + '<div class="profile-detail">'+(u.location?'<span>'+ico('pin')+' '+esc(u.location)+'</span>':'')+(u.website?'<span>'+ico('share')+' '+(websiteUrl?'<a href="'+esc(websiteUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(u.website)+'</a>':esc(u.website))+'</span>':'')+'<span>'+ico('calendar')+' '+esc(u.joined||'')+'から利用</span></div>'
 + '<div class="profile-stats"><a href="#" data-action="show-followers" data-type="following" data-id="'+esc(id)+'"><b>'+short(u.following||0)+'</b> <span>フォロー中</span></a><a href="#" data-action="show-followers" data-type="followers" data-id="'+esc(id)+'"><b>'+short(u.followers||0)+'</b> <span>フォロワー</span></a></div></div>'
 + '<div class="profile-tabs">'+[['posts','ポスト'],['replies','返信'],['media','メディア'],['likes','いいね']].map(([key,label])=>'<button class="'+(state.profileTab===key?'active':'')+'" data-action="profile-tab" data-value="'+key+'">'+label+'</button>').join('')+'</div>'+ (state.profileTab==='likes'&&state.profileLikesFor!==id?'<div class="empty"><p>読み込み中…</p></div>':state.profileTab==='likes'&&!posts.length?'<div class="empty"><h2>いいねしたポストはありません</h2></div>':feedPosts(posts))+(state.profileTab==='likes'?'':loadMorePostsButton());
}
function renderSettings(){
 const u=me();
 if(!state.authUser)return header('設定')+'<div class="page-intro"><h2>アカウント設定</h2><p>Lime2にログインしてプロフィールを管理できます。</p><button class="primary" data-action="auth-modal">ログイン / 新規登録</button></div>';
 return header('設定')+'<div class="page-intro"><h2>アカウント設定</h2><p>アカウントとプロフィールを管理します。</p></div>'
 + '<section class="settings-section"><h3>プロフィール</h3><p>'+esc(u.name)+' · @'+esc(u.handle)+'</p><button class="primary" data-action="edit-profile">プロフィールを編集</button></section>'

async function addPost(text,replyTo=null,extras={}){
 if(!requireAuth())return false;
 const clean=(text||'').trim();
 if(!clean&&!extras.gif&&!extras.poll){toast('ポスト本文を入力してください');return false}
 try{
  if(replyTo){
   const parent=state.posts.find(p=>p.id===replyTo);

    if(parent.replyPermission==='following'){
     const followResult=await supabaseClient.from('follows').select('follower_id').eq('follower_id',parent.userId).eq('following_id',state.authProfileId).limit(1);
     if(followResult.error)throw followResult.error;
     if(!(followResult.data||[]).length){toast('このポストは投稿者がフォローしているアカウントのみ返信できます。');return false}
    }else if(parent.replyPermission==='mentioned'){
     const mentions=(parent.text||'').toLowerCase().match(/(^|[^a-z0-9_])@([a-z0-9_-]+)/g)||[];
     if(!mentions.some(mention=>mention.slice(mention.lastIndexOf('@')+1)===me().handle.toLowerCase())){toast('このポストはメンションされたアカウントのみ返信できます。');return false}
    }
   }
  }
  const payload={author_id:state.authProfileId,body:clean,reply_to:replyTo||null,media_urls:[],gif_label:extras.gif||null,poll_options:extras.poll?.length?extras.poll:null,poll_duration:extras.poll?.length?(extras.pollDuration||'1日'):null,warning:extras.warning||null,location:extras.location||null,reply_permission:extras.permission||'everyone',scheduled_at:extras.schedule?new Date(extras.schedule).toISOString():null};
  const result=await supabaseClient.from('posts').insert(payload).select().single();
  if(result.error){
   if(replyTo&&result.error.code==='42501'){toast('このポストは返信できるアカウントが制限されています。');return false}
   throw result.error;
  }
  state.draft='';await refreshAppData();
  if(replyTo){state.view='post';state.postId=replyTo}else{state.view='home';state.timeline='for-you'}
  closeModal();render();window.scrollTo(0,0);
  toast(extras.schedule?'ポストを予約しました':replyTo?'返信しました':'ポストしました');return true;
 }catch(error){toast(supaMessage(error));return false}
}

async function makeConversation(id){
 if(!requireAuth()||!id||id===state.authProfileId)return;
 try{
  const mine=await supabaseClient.from('conversation_members').select('conversation_id').eq('user_id',state.authProfileId).order('joined_at',{ascending:false}).limit(100);
  if(mine.error)throw mine.error;
  const ids=(mine.data||[]).map(x=>x.conversation_id);let conversationId=null;
  if(ids.length){
   const other=await supabaseClient.from('conversation_members').select('conversation_id,joined_at').eq('user_id',id).in('conversation_id',ids).order('joined_at',{ascending:false}).limit(100);
   if(other.error)throw other.error;
   const sharedIds=new Set(ids);
   conversationId=(other.data||[]).find(row=>sharedIds.has(row.conversation_id))?.conversation_id||null;
  }
  if(!conversationId){
   const made=await supabaseClient.from('conversations').insert({created_by:state.authProfileId}).select().single();
   if(made.error)throw made.error;conversationId=made.data.id;
   const added=await supabaseClient.from('conversation_members').insert([{conversation_id:conversationId,user_id:state.authProfileId},{conversation_id:conversationId,user_id:id}]);
   if(added.error)throw added.error;
  }
  await refreshAppData();state.selectedChat=conversationId;state.view='messages';render();
 }catch(error){toast(supaMessage(error))}
}
async function sendMessage(text){
 if(!requireAuth())return false;
 const conversation=state.messages.find(x=>x.id===state.selectedChat);
 if(!conversation||!text.trim())return false;
 try{
  const clean=text.trim();
  const result=await supabaseClient.from('messages').insert({conversation_id:conversation.id,sender_id:state.authProfileId,body:clean}).select('id,created_at').single();
  if(result.error)throw result.error;
  conversation.messages=[...(conversation.messages||[]),{id:result.data?.id||'',from:'me',text:clean,at:result.data?.created_at||new Date().toISOString()}];
  state.selectedChat=conversation.id;
  render();
  refreshAppData().catch(error=>{console.error('Message refresh failed:',error);toast('メッセージは送信されましたが、表示の更新に失敗しました。')});
  return true;
 }catch(error){toast(supaMessage(error));return false}
}

 case'vote-poll':{
  if(!requireAuth())break;
  const pollPost=state.posts.find(x=>x.id===id);
  if(!pollPost?.poll){toast('この投票は利用できません。');break}
  if(!pollPost.poll.expiresAt||Date.parse(pollPost.poll.expiresAt)<=Date.now()){toast('この投票は終了しました。');break}
  const option=Number(el.dataset.option);
  if(!Number.isInteger(option)||option<0||option>=pollPost.poll.options.length){toast('選択肢が正しくありません。');break}
  const result=await supabaseClient.from('poll_votes').insert({post_id:id,user_id:state.authProfileId,option_index:option});
  if(result.error){toast(result.error.code==='23505'?'投票済みです。':supaMessage(result.error));break}
  await refreshAppData();break;
 }
 case'save-post-edit':{
   if(!requireAuth())break;
   const post=state.posts.find(x=>x.id===id);
   if(!post||post.userId!==state.authProfileId){toast('このポストを編集する権限がありません。');break}
   const body=$('#edit-post-body')?.value.trim()||'';
   if(!body&&!post.gif&&!post.poll){toast('ポスト本文を入力してください');break}
   const result=await supabaseClient.from('posts').update({body,updated_at:new Date().toISOString()}).eq('id',id).eq('author_id',state.authProfileId).select('id').single();
   if(result.error){toast(supaMessage(result.error));break}
   closeModal();await refreshAppData();toast('ポストを更新しました');break;
  }
  case'delete-post':{
  if(!requireAuth())break;
  if(!confirm('このポストを削除しますか？'))break;
  const result=await supabaseClient.from('posts').delete().eq('id',id);
  if(result.error){toast(supaMessage(result.error));break}
  closeModal();await refreshAppData();
  if(state.view==='post')goBack();else render();
  toast('ポストを削除しました');break;
 }
 case'report-post':{
  if(!requireAuth())break;
  openModal('<div class="modal-head"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">'+ico('close')+'</button><h2>ポストを報告</h2></div><div class="form-modal-body"><label class="field"><span>報告理由</span><select id="report-reason"><option value="spam">スパム</option><option value="abuse">嫌がらせ・攻撃的な内容</option><option value="misinformation">誤情報</option><option value="sensitive">不適切なコンテンツ</option><option value="other">その他</option></select></label><label class="field"><span>詳細（任意）</span><textarea id="report-details" maxlength="500"></textarea></label><button class="primary" data-action="submit-report" data-id="'+esc(id)+'">報告を送信</button></div>',{label:'ポストを報告'});
  break;
 }
 case'submit-report':{
  if(!requireAuth())break;
  const post=state.posts.find(p=>p.id===id);
  const result=await supabaseClient.from('reports').insert({reporter_id:state.authProfileId,post_id:id,reported_user_id:post?.userId||null,reason:$('#report-reason')?.value||'other',details:$('#report-details')?.value||''});
  if(result.error){toast(supaMessage(result.error));break}
  closeModal();toast('報告を送信しました');break;
 }
 case'mute-user':{
  if(!requireAuth())break;
  const result=await supabaseClient.from('muted_users').insert({user_id:state.authProfileId,muted_user_id:id});
  if(result.error&&result.error.code!=='23505'){toast(supaMessage(result.error));break}
  closeModal();await refreshAppData();toast('このアカウントをミュートしました');break;
 }
 case'chat-menu':{
  const conversation=state.messages.find(x=>x.id===state.selectedChat);
  if(conversation)openModal('<div class="modal-head"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">'+ico('close')+'</button><h2>会話の設定</h2></div><div class="form-modal-body"><p>'+esc(user(conversation.userId).name)+'との会話</p><button class="follow-btn following" data-action="leave-conversation" data-id="'+esc(conversation.id)+'">会話を削除</button></div>',{label:'会話の設定'});
  break;
 }
 case'leave-conversation':{
  if(!requireAuth())break;
  const result=await supabaseClient.from('conversation_members').delete().eq('conversation_id',id).eq('user_id',state.authProfileId);
  if(result.error){toast(supaMessage(result.error));break}
  closeModal();await refreshAppData();state.selectedChat=state.messages[0]?.id||'';render();toast('会話を削除しました');break;
 }
 case'account-menu':{
  if(!state.authUser){openAuthModal('signin');break}
  openModal('<div class="modal-head"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">'+ico('close')+'</button><h2>アカウント</h2></div><div class="suggestion">'+avatar(me())+'<div class="suggestion-info"><strong>'+esc(me().name)+'</strong><small>@'+esc(me().handle)+'</small></div></div><div class="form-modal-body"><button class="nav-item" data-action="profile-open" data-id="'+esc(me().id)+'">'+ico('user')+'プロフィールを見る</button><button class="nav-item" data-action="edit-profile">'+ico('settings')+'プロフィールを編集</button><button class="follow-btn following" data-action="sign-out">ログアウト</button></div>',{label:'アカウント'});
  break;
 }
 case'auth-modal':openAuthModal('signin');break;
 case'auth-switch':closeModal({restoreFocus:false,preserveReturnFocus:true});openAuthModal(val);break;
 case'sign-out':await signOut();break;
 case'open-image':{const imageUrl=safeImageUrl(el.dataset.src);if(!imageUrl)break;openModal('<div class="image-viewer"><button class="icon-btn" data-action="close-modal" aria-label="閉じる">'+ico('close')+'</button><img src="'+esc(imageUrl)+'" alt="投稿画像"></div>',{className:'image-modal',label:'画像を表示'});break;}
 case'retry-load':{
  $('#main').setAttribute('aria-busy','true');
  try{await loadAppData();await loadSharedPostFromHash()}
  catch(error){showLoadError(error)}
  break;
 }
 case'reset':if(confirm('ページを再読み込みしますか？'))location.reload();break;
 }
}
function isDescendant(post,id){let current=post;let steps=0;while(current?.replyTo&&steps++<20){if(current.replyTo===id)return true;current=state.posts.find(x=>x.id===current.replyTo)}return false}
function updateDetailCount(){const t=$('#detail-reply');if(t){$('#detail-reply-count').textContent=t.value.length+'/280';const b=$('[data-action="submit-detail-reply"]');if(b)b.disabled=!t.value.trim()}}
// Event delegation: one listener for the whole app keeps dynamically rendered controls active.
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){event.preventDefault();navigate(nav.dataset.nav,nav.dataset.nav==='profile'?{profileId:me().id}:{});return}const trend=event.target.closest('[data-trend]');if(trend){event.preventDefault();doSearch(trend.dataset.trend);return}const el=event.target.closest('[data-action]');if(el){event.preventDefault();action(el,event);return}const card=event.target.closest('[data-post]');if(card&&!event.target.closest('button,a,textarea,input'))openPost(card.dataset.post)});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='quick-compose'){state.draft=t.value;const b=$('#quick-post');if(b)b.disabled=!t.value.trim();save()}if(t.id==='modal-text'){if(composeState)composeState.text=t.value;updateComposeCount()}if(t.id==='search-input'){state.searchTerm=t.value;const results=$('#search-results');if(results)results.innerHTML=searchResults()}if(t.id==='detail-reply')updateDetailCount();if(t.id==='edit-post-body'){const count=$('#edit-post-count');if(count)count.textContent=t.value.length+'/280'}if(t.dataset.pollOption!==undefined&&composeState)composeState.poll[Number(t.dataset.pollOption)]=t.value});
document.addEventListener('change',event=>{if(event.target.id==='schedule-at'&&composeState)composeState.schedule=event.target.value});
document.addEventListener('keydown',event=>{const dialog=$('#modal-root [role="dialog"]');if(dialog){if(event.key==='Escape'&&!event.isComposing){event.preventDefault();closeModal();return}if(event.key==='Tab'){const focusables=modalFocusableElements(dialog);if(!focusables.length){event.preventDefault();dialog.setAttribute('tabindex','-1');dialog.focus();return}const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus()}return}}if(event.target.id==='global-search'&&event.key==='Enter'){event.preventDefault();doSearch(event.target.value);return}if(event.key==='Escape'&&!event.isComposing){closeModal();return}if((event.metaKey||event.ctrlKey)&&event.key==='Enter'){if($('#modal-text'))$('[data-action="submit-compose"]')?.click();else if($('#detail-reply'))$('[data-action="submit-detail-reply"]')?.click()}if(!dialog&&event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();$('#global-search')?.focus()}});
document.addEventListener('submit',async event=>{if(event.target.id==='auth-form'){await handleAuthSubmit(event);return}if(event.target.id==='chat-form'){event.preventDefault();const form=event.target,input=$('#chat-input'),text=input?.value.trim();if(!text)return;const button=$('button[type="submit"]',form);if(input)input.disabled=true;if(button)button.disabled=true;const sent=await sendMessage(text);if(!sent){if(input){input.disabled=false;input.focus()}if(button)button.disabled=false}}});
window.addEventListener('popstate',()=>{if(state?.view==='post')goBack()});
 window.addEventListener('hashchange',()=>{if(sharedPostIdFromHash())loadSharedPostFromHash();else if(state?.view==='post')goBack()});
$('#main').setAttribute('aria-busy','true');
loadAppData().then(()=>loadSharedPostFromHash()).catch(showLoadError);
})();

</script>
